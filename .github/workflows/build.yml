name: Build

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, to pick up new Deployer and Infisical CLI releases
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        deployer_version: [v7, v8]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Build for testing
        uses: docker/build-push-action@v7
        with:
          context: .
          pull: true
          load: true
          build-args: DEPLOYER_VERSION=${{ matrix.deployer_version }}
          tags: test-image

      - name: Test
        run: |
          docker run --rm test-image dep --version
          docker run --rm test-image infisical --version

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ matrix.deployer_version }}
            type=sha,prefix=${{ matrix.deployer_version }}-

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          pull: true
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          build-args: DEPLOYER_VERSION=${{ matrix.deployer_version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
